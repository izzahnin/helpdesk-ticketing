securityDefinitions:
  BearerAuth:
    description: Enter the token using the Bearer scheme.
    in: header
    name: Authorization
    type: apiKey
  RefreshCookie:
    in: cookie
    name: refresh_token
    type: apiKey
swagger: "2.0"
