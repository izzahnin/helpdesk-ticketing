basePath: /
definitions:
  dto.AssignTicketRequest:
    properties:
      assignee_id:
        type: integer
    required:
    - assignee_id
    type: object
  dto.CategoryRequest:
    properties:
      default_sla_hours:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  dto.CommentRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  dto.DashboardSummaryResponse:
    properties:
      open_tickets:
        type: integer
      resolved_tickets:
        type: integer
      sla_compliance_pct:
        type: number
      status_summary:
        items:
          $ref: '#/definitions/dto.StatusSummaryResponse'
        type: array
      total_tickets:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.MyPerformanceResponse:
    properties:
      assigned_total:
        type: integer
      avg_resolution_hours:
        type: number
      resolved_total:
        type: integer
      sla_breaches:
        items:
          $ref: '#/definitions/dto.SLABreachResponse'
        type: array
      sla_compliance_pct:
        type: number
      status_summary:
        items:
          $ref: '#/definitions/dto.StatusSummaryResponse'
        type: array
    type: object
  dto.RefreshResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.SLABreachResponse:
    properties:
      id:
        type: integer
      priority:
        type: string
      sla_deadline:
        type: string
      title:
        type: string
    type: object
  dto.SLARuleRequest:
    properties:
      category_id:
        type: integer
      priority:
        type: string
      resolution_hours:
        minimum: 1
        type: integer
    required:
    - category_id
    - priority
    - resolution_hours
    type: object
  dto.StaffPerformanceResponse:
    properties:
      avg_resolution_hours:
        type: number
      rank:
        type: integer
      resolved:
        type: integer
      staff_id:
        type: integer
      staff_name:
        type: string
    type: object
  dto.StatusSummaryResponse:
    properties:
      count:
        type: integer
      status:
        type: string
    type: object
  dto.SubmitTicketRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      priority:
        type: string
      title:
        type: string
    required:
    - category_id
    - description
    - title
    type: object
  dto.TrendPointResponse:
    properties:
      count:
        type: integer
      week:
        type: string
    type: object
  dto.UpdateTicketStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      role:
        type: string
    required:
    - role
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      default_sla_hours:
        type: integer
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.SLARule:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      priority:
        type: string
      resolution_hours:
        type: integer
      updated_at:
        type: string
    type: object
  models.Ticket:
    properties:
      assignee_id:
        type: integer
      category_id:
        type: integer
      category_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      priority:
        type: string
      requester_id:
        type: integer
      resolved_at:
        type: string
      sla_deadline:
        type: string
      sla_total_hours:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:4000
info:
  contact: {}
  description: REST API for the internal helpdesk and ticketing system.
  title: Helpdesk Ticketing API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login and issue access token
      tags:
      - auth
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - RefreshCookie: []
      summary: Revoke the refresh token and clear its cookie
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the authenticated user
      tags:
      - auth
  /api/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - RefreshCookie: []
      summary: Refresh the access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new end user
      tags:
      - auth
  /api/categories:
